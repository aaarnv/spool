# Vertical ship reel on every merged pull request (live copy of docs/examples/ship-reel.yml).
# Reel authoring is agent work (docs/SHIP-REEL-CONTRACT.md), so this pairs the
# setup-spool action with claude-code-action for the authoring step.
#
# Secrets required:
#   SPOOL_TOKEN              spk_ publish token, minted at https://spoolkit.dev/dashboard
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (Claude subscription)
# Repo variable (optional):
#   SPOOL_PREVIEW_URL        deployment to record against; unset means explainer fallback

name: Ship reel

on:
  pull_request:
    types: [closed]

jobs:
  reel:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Vertical renders 60fps over the whole cut, so cap the job rather than the render.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A reel shows what SHIPPED, so record the merge commit, not the PR head.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # Installs the spool CLI, ffmpeg and headless chromium; writes ~/.spool.json
      # from the token; caps SPOOL_RENDER_CONCURRENCY for CI.
      - uses: aaarnv/spool@master
        with:
          token: ${{ secrets.SPOOL_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty string when the repo variable is unset; the prompt branches on that.
          SPOOL_PREVIEW_URL: ${{ vars.SPOOL_PREVIEW_URL }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Reel authoring measured ~103 turns; the default cap silently truncated runs.
          claude_args: '--max-turns 200 --allowedTools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            Publish a Spool ship reel for merged pull request #${{ github.event.pull_request.number }}
            and comment the watch link on it. A ship reel is a 20 to 40 second VERTICAL spool of what
            this PR shipped: hook first, owner voice, 2 to 4 stops. Follow the contract at
            docs/SHIP-REEL-CONTRACT.md in aaarnv/spool.

            Runner constraints: the spool CLI, ffmpeg and headless chromium are installed and
            SPOOL_RENDER_CONCURRENCY is already capped. Never pass --headed. Never pass --target os.
            There is no display and no macOS on this runner.

            1. Run: spool pr ${{ github.event.pull_request.number }}
               This scaffolds spool/pr-N/ with pr.json, diff.patch, tour.json, context.json,
               context.md. Read pr.json and diff.patch and decide, in one line, what shipped and why
               a developer who uses this repo cares.
            2. Choose the footage. Run: echo "$SPOOL_PREVIEW_URL"
               - Non-empty: that is a running deployment of this repo. curl it once so the first
                 compile is warm, then record the REAL app there.
               - Empty: do NOT jump straight to an explainer. First ask whether this change's
                 user-visible OUTPUT already lands on a live surface, even when the diff touches no
                 UI at all: a spoolkit.dev watch page rendering what this repo produces, a
                 dashboard, any published artifact. If one qualifies, record that real surface.
               - Only when nothing qualifies: author a self-contained spool/pr-N/explainer.html and
                 record it with --url "file://$PWD/spool/pr-N/explainer.html". It MUST show real
                 artifacts from this PR (actual diff hunks, actual output, actual config), never
                 bullet slides. Every stop's main surface must be a DIAGRAM (a flow, boxes and
                 arrows, a before/after panel, a labelled anatomy) with text only as labels, and
                 code or yaml only as a small excerpt annotated inside a visual, never as the
                 stop's main surface; if a paused frame would work as a screenshot in a text doc,
                 the stop is not visual enough. Author it inside a 640px centred column and reveal
                 each stop by scrolling, never clicking: the vertical camera shows about 672px of
                 the 1920px capture, and a click zooms to 1.25 and pans off centre. See the
                 contract.
            3. Seed the capture viewport BEFORE recording. Write spool/pr-N/steps.mjs containing
               exactly: export const config = { viewport: { width: 1920, height: 1080 } };
               The vertical camera crops the landscape capture, so the 1600x900 default renders soft.
            4. Record 2 to 4 stops, one idea each:
                 spool live spool/pr-N --url <the url from step 2> --format vertical --title "<the PR title>"
               ALWAYS pass --title. Vertical renders draw no title card, so --title is the published
               spool title AND the hook's fallback; a reel published without it is a defect.
               spool live prints {"port":N,...} on stdout. Drive it with curl in ONE shell script:
               POST /step per stop (name = the tour stop id, narration = ONE sentence in owner voice,
               present tense, why-first), POST /js between steps, then POST /end. Total narration is
               55 to 90 words across the whole reel. The first recorded seconds must show the surface
               this PR changed most, so do any navigation or login before the first /step.
            5. Author the vertical frame in the GENERATED spool/pr-N/steps.mjs config, AFTER /end and
               BEFORE finish. The /end rewrite keeps only url, viewport, title, format and prep, so
               these must be added afterwards or they are silently lost:
                 hook: '<7 words or fewer, the payoff, not the topic>',
                 cta: { text: 'Follow this repo on spoolkit.dev', url: 'spoolkit.dev' },
                 music: 'uplift',
               Never omit cta: its default URL is the recorded URL's hostname.
            6. Rewrite tour.json down to exactly the stops you recorded: one stop per step, stop id
               equal to the step name, 2 to 4 stops, mode "walkthrough" when you recorded the real
               app or "explainer" when you recorded explainer.html. A stop matching no recorded step
               is a lint ERROR and blocks the publish. Also author context.md and curate
               context.json "related". No em dashes in any authored text.
            7. Run: spool finish spool/pr-N --format vertical
               It renders 1080x1920, publishes, and comments the watch link on the PR. Confirm with
               ffprobe that final.mp4 is 1080x1920 and 20 to 40 seconds.

      # claude-code-action exits 0 even when the agent stopped early (turn cap, no account
      # connected, a swallowed comment failure), so assert the artifact this job exists to
      # produce rather than trusting the step's exit code.
      - name: Assert the reel published and landed on the PR
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          published="spool/pr-${PR}/share/published.json"
          if [ ! -f "$published" ]; then
            gh pr comment "$PR" --body "Spool ship reel did not publish: no share/published.json was written, so the run ended before publishing. Job log: $RUN_URL"
            echo "::error::no reel was published for PR $PR"
            exit 1
          fi
          url=$(sed -n 's/.*"url": *"\([^"]*\)".*/\1/p' "$published" | head -1)
          if [ -z "$url" ]; then
            echo "::error::$published exists but carries no url"
            exit 1
          fi
          echo "published: $url"
          if gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "$url"; then
            echo "watch link is on the PR"
            exit 0
          fi
          gh pr comment "$PR" --body "Ship reel: $url"
          echo "::error::reel published but the agent posted no comment; CI posted the link"
          exit 1
