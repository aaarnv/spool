# Lint for the CLI: every module under bin/ and src/ must parse. No install, no
# tests, no browser; the full suite runs locally (`npm test`, see ops/cloud/README.md).
#
# This is the one workflow the repo keeps on purpose.
# The web app deploys through Vercel's Git integration on merge to master, not
# from a workflow here.

name: lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: find bin src -name '*.mjs' -print0 | xargs -0 -n1 node --check
